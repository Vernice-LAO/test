<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 切水果遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
        }

        canvas {
            border: 2px solid #fff;
            background: linear-gradient(#87CEEB, #98FB98);
            display: block;
        }

        .game-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px #000;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            text-shadow: 2px 2px 4px #000;
            display: none;
        }

        .restart-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 20px;
            background-color: #ff6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .restart-btn:hover {
            background-color: #ff4500;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="game-info">分數: <span id="score">0</span></div>
        <div class="game-over" id="gameOver">遊戲結束!</div>
        <button class="restart-btn" id="restartBtn">重新開始</button>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        // 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        // 游戏参数
        let score = 0;
        let fruits = [];
        let blades = [];
        let gameRunning = true;
        let animationId;

        // 水果类型定义
        const fruitTypes = [
            { color: '#FF0000', name: 'apple' },    // 红苹果
            { color: '#FFA500', name: 'orange' },   // 橙子
            { color: '#FFFF00', name: 'banana' },   // 香蕉
            { color: '#9ACD32', name: 'kiwi' },     // 猕猴桃
            { color: '#800080', name: 'grape' },    // 葡萄
            { color: '#FF4500', name: 'cherry' },   // 樱桃
            { color: '#00FF00', name: 'bomb', isBomb: true } // 炸弹（绿色）
        ];

        // 初始化事件监听
        function initEvents() {
            // 鼠标/触摸移动监听
            canvas.addEventListener('mousemove', (e) => {
                if (!gameRunning) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // 添加刀光效果
                blades.push({
                    x, y,
                    time: Date.now()
                });

                // 检测切割
                checkSlice(x, y);
            });

            // 触摸屏支持
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!gameRunning) return;
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                blades.push({
                    x, y,
                    time: Date.now()
                });

                checkSlice(x, y);
            }, { passive: false });

            // 重新开始按钮
            restartBtn.addEventListener('click', restartGame);
        }

        // 检查是否切割到水果
        function checkSlice(x, y) {
            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                const dx = x - fruit.x;
                const dy = y - fruit.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 如果距离小于水果半径，判定为切割
                if (distance < fruit.radius) {
                    if (fruit.isBomb) {
                        // 切到炸弹，游戏结束
                        gameOver();
                        return;
                    }

                    // 加分
                    score += 10;
                    scoreElement.textContent = score;
                    
                    // 标记为已切割
                    fruit.sliced = true;
                    fruit.sliceTime = Date.now();
                    
                    // 切割后分成两半，向不同方向飞散
                    fruit.parts = [
                        { vx: -3 - Math.random() * 2, vy: -5 - Math.random() * 2 },
                        { vx: 3 + Math.random() * 2, vy: -5 - Math.random() * 2 }
                    ];
                }
            }
        }

        // 创建新水果
        function createFruit() {
            if (!gameRunning) return;
            
            const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            const radius = 20 + Math.random() * 10;
            
            // 随机位置（左右两侧）
            const x = Math.random() > 0.5 ? radius : canvas.width - radius;
            const y = canvas.height + radius;
            
            // 随机速度和角度
            const angle = Math.PI/4 + Math.random() * Math.PI/2;
            const speed = 8 + Math.random() * 4;
            const vx = Math.cos(angle) * speed * (x < canvas.width/2 ? 1 : -1);
            const vy = -Math.sin(angle) * speed;
            
            fruits.push({
                x, y,
                vx, vy,
                radius,
                color: type.color,
                isBomb: type.isBomb || false,
                sliced: false,
                gravity: 0.2 // 重力加速度
            });
        }

        // 更新水果位置
        function updateFruits() {
            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                
                if (fruit.sliced) {
                    // 切割后的水果碎片
                    fruit.parts.forEach(part => {
                        part.vy += fruit.gravity;
                    });
                    
                    fruit.x += fruit.parts[0].vx;
                    fruit.y += fruit.parts[0].vy;
                    
                    // 碎片消失时间
                    if (Date.now() - fruit.sliceTime > 500) {
                        fruits.splice(i, 1);
                    }
                } else {
                    // 正常下落的水果
                    fruit.vy += fruit.gravity;
                    fruit.x += fruit.vx;
                    fruit.y += fruit.vy;
                    
                    // 超出屏幕移除
                    if (fruit.y > canvas.height + fruit.radius || 
                        fruit.x < -fruit.radius || 
                        fruit.x > canvas.width + fruit.radius) {
                        fruits.splice(i, 1);
                    }
                }
            }
        }

        // 绘制水果
        function drawFruits() {
            fruits.forEach(fruit => {
                ctx.beginPath();
                
                if (fruit.sliced) {
                    // 绘制切割后的两半
                    ctx.arc(fruit.x - 5, fruit.y, fruit.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fruit.color;
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(fruit.x + 5, fruit.y, fruit.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fruit.color;
                    ctx.fill();
                    
                    // 绘制切割线
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(fruit.x - fruit.radius, fruit.y);
                    ctx.lineTo(fruit.x + fruit.radius, fruit.y);
                    ctx.stroke();
                } else {
                    // 绘制完整水果
                    ctx.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fruit.color;
                    ctx.fill();
                    
                    // 水果高光效果
                    ctx.beginPath();
                    ctx.arc(fruit.x - fruit.radius/3, fruit.y - fruit.radius/3, fruit.radius/4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fill();
                }
            });
        }

        // 绘制刀光
        function drawBlades() {
            // 清理过期刀光
            blades = blades.filter(blade => Date.now() - blade.time < 100);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            // 绘制连续的刀光轨迹
            for (let i = 1; i < blades.length; i++) {
                const prev = blades[i-1];
                const curr = blades[i];
                
                ctx.beginPath();
                ctx.moveTo(prev.x, prev.y);
                ctx.lineTo(curr.x, curr.y);
                ctx.stroke();
            }
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'block';
            restartBtn.style.display = 'block';
            cancelAnimationFrame(animationId);
        }

        // 重新开始游戏
        function restartGame() {
            score = 0;
            scoreElement.textContent = score;
            fruits = [];
            blades = [];
            gameRunning = true;
            
            gameOverElement.style.display = 'none';
            restartBtn.style.display = 'none';
            
            gameLoop();
        }

        // 游戏主循环
        function gameLoop() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameRunning) {
                // 随机生成水果
                if (Math.random() < 0.02) {
                    createFruit();
                }
                
                updateFruits();
            }
            
            drawFruits();
            drawBlades();
            
            if (gameRunning) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // 初始化游戏
        initEvents();
        gameLoop();
    </script>
</body>
</html>
